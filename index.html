<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Licenciatura en Fisioterapia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0}

/* Layout: one centered answer-sheet column; question card on top, bubble answer sheet below, results replace the card at the end */
:root{
  --paper:#f3f5f1; --sheet:#ffffff; --ink:#18221f; --muted:#5b6a64; --line:#d6ddd8;
  --accent:#0d6b58; --accent-ink:#ffffff; --accent-soft:#dcefe8;
  --ok:#1d7a3e; --ok-soft:#e1f3e6; --bad:#b3261e; --bad-soft:#fbe5e2; --warn:#8a5a00; --warn-soft:#fbf0d9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1513; --sheet:#17201d; --ink:#e7eeea; --muted:#9db0a8; --line:#2c3a35;
  --accent:#4cc3a3; --accent-ink:#06231c; --accent-soft:#163a31;
  --ok:#5fd28a; --ok-soft:#173826; --bad:#ff8a80; --bad-soft:#41201d; --warn:#f3c26b; --warn-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1513; --sheet:#17201d; --ink:#e7eeea; --muted:#9db0a8; --line:#2c3a35;
  --accent:#4cc3a3; --accent-ink:#06231c; --accent-soft:#163a31;
  --ok:#5fd28a; --ok-soft:#173826; --bad:#ff8a80; --bad-soft:#41201d; --warn:#f3c26b; --warn-soft:#3a2f17; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(1.45rem,4.2vw,2.1rem);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.btn{font:inherit;font-weight:700;border-radius:999px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* status strip */
.strip{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.count{font-family:var(--mono);font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums}
.tally{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-family:var(--mono);font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.bar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
/* question card */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;display:flex;gap:10px;flex-wrap:wrap}
.eyebrow span+span{color:var(--muted)}
.qtext{font-size:1.08rem;white-space:pre-line;margin:0;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.bub{width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:.9rem;color:var(--muted)}
.opt .txt{min-width:0;overflow-wrap:anywhere}
.opt .mark{font-family:var(--mono);font-size:.78rem;font-weight:600;white-space:nowrap}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.correct .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt.wrong .mark{color:var(--bad)}
.feedback{border-radius:12px;padding:12px 16px;font-size:.98rem}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback b{display:block;font-family:var(--display);font-size:1.05rem}
.feedback .ans{color:var(--ink)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.82rem;align-self:center}
/* answer sheet */
details.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
details.sheet summary{cursor:pointer;font-weight:700;font-family:var(--display)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:12px}
.cell{font-family:var(--mono);font-size:.78rem;font-weight:600;height:34px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
/* settings */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,26px);display:flex;flex-direction:column;gap:16px}
.panel h2,.results h2{font-family:var(--display);font-weight:800;margin:0;font-size:1.35rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip{font:inherit;font-size:.88rem;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip small{font-family:var(--mono);color:var(--muted);margin-left:4px}
.avail{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
/* results */
.results{display:flex;flex-direction:column;gap:18px}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.score .big{font-family:var(--display);font-weight:800;font-size:clamp(3rem,12vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums}
.score .of{font-family:var(--mono);color:var(--muted)}
.verdict{font-weight:700}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.n{text-align:right}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.meter>i{display:block;height:100%;background:var(--accent)}
.miss{display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.miss li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.miss .q{white-space:pre-line;overflow-wrap:anywhere}
.miss .you{color:var(--bad);font-size:.92rem}
.miss .right{color:var(--ok);font-size:.92rem;font-weight:700}
footer{color:var(--muted);font-size:.82rem;text-align:center}
@media (max-width:520px){.opt{grid-template-columns:30px 1fr;padding:10px 12px}.opt .mark{grid-column:2}.bub{width:30px;height:30px}.strip{grid-template-columns:1fr}.tally{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Simulador de Licenciatura</h1>
      <p id="sub">Fisioterapia · banco de preguntas</p>
    </div>
    <div class="row">
      <button class="btn" id="btnCfg" type="button">Configurar</button>
      <button class="btn" id="btnNew" type="button">Nuevo simulacro</button>
    </div>
  </header>

  <section class="panel" id="cfg" hidden aria-labelledby="cfgTitle">
    <h2 id="cfgTitle">Configurar simulacro</h2>
    <div class="row"><span class="lbl">Número de preguntas</span></div>
    <div class="row" id="nRow"></div>
    <div class="row" style="justify-content:space-between"><span class="lbl">Asignaturas</span>
      <span class="row"><button class="chip" id="allOn" type="button">Todas</button><button class="chip" id="allOff" type="button">Ninguna</button></span></div>
    <div class="row" id="subjRow"></div>
    <div class="row" style="justify-content:space-between">
      <span class="avail" id="avail"></span>
      <span class="row"><button class="btn" id="cfgCancel" type="button">Cancelar</button><button class="btn primary" id="cfgGo" type="button">Comenzar simulacro</button></span>
    </div>
  </section>

  <section id="quiz">
    <div class="strip">
      <div class="count" id="count"></div>
      <div class="tally"><span class="pill ok" id="tOk"></span><span class="pill bad" id="tBad"></span></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <article class="card" id="card" style="margin-top:14px">
      <div class="eyebrow" id="eyebrow"></div>
      <p class="qtext" id="qtext"></p>
      <ul class="opts" id="opts"></ul>
      <div id="fb"></div>
      <div class="nav">
        <button class="btn" id="prev" type="button">← Anterior</button>
        <span class="hint" id="hint">Atajos: teclas A–H para responder, Enter para continuar</span>
        <button class="btn primary" id="next" type="button">Siguiente →</button>
      </div>
    </article>
    <details class="sheet" id="sheet" style="margin-top:14px">
      <summary>Hoja de respuestas</summary>
      <div class="grid" id="grid"></div>
    </details>
  </section>

  <section class="results card" id="results" hidden></section>

  <footer>Las respuestas correctas corresponden a la clave marcada en el documento de preguntas original.</footer>
</div>

e Daniels lo ubicamos en una nota. Seleccione la respuesta correcta.","o":["Nota 3","Nota 0","Nota 1"],"a":1},{"s":"Técnica de Evaluación Funcional","q":"Paciente que durante el examen físico pudimos determinar la presencia de dolor, edema, atrofia muscular, limitación de los movimientos articulares y dificultad para el desarrololo normal de la marcha. Toda esta información es válida para. Seleccione la respuesta correcta.","o":["Establecer pautas para la casa","Establecer pronostico a corto, mediano y largo plazo","Proceder con la reexaminación del paciente."],"a":1},{"s":"Técnica de Evaluación Funcional","q":"Paciente que durante el examen físico pudimos conocer que como resultado de su enfermedad actual le ha tocado entrenar un cambio de dominancia manual y la ayuda de un familiar para el desarrollo de sus actividades cotidianas de la vida diaria esto ha cambiado su independencia por lo que al ubicar su grado de independencia se determina que el mismo es. Seleccione la respuesta correcta.","o":["Independiente","Semindependiente","Dependiente"],"a":1},{"s":"Técnica de Evaluación Funcional","q":"Debe ser expresado en términos de disfunción o limitación del movimiento o funcional, limitación articular, limitaciones en la actividad, restricciones en la participación, la influencia de su entorno, los factores ambientales o las capacidades/discapacidades. Seleccione la respuesta correcta que parte del examen físico se describe.","o":["Historia de la enfermedad actual","Pronostico","Diagnostico fisioterapéutico o funcional"],"a":2},{"s":"Técnica de Evaluación Funcional","q":"Paciente que luego de 15 sesiones de fisioterapia y haber alcanzo el 100% de los objetivos trazados, ya le corresponde la reexaminación y el licenciado deberá tomar algunas decisiones tales como. Seleccione la respuesta correcta.","o":["Dar el alta médica e indicarle ejercicios para el hogar.","Sugerir descanso médico y volver si aparece dolor u otras molestias","Sugerir el alta médica y ejercicios para el hogar"],"a":2},{"s":"Técnica de Evaluación Funcional","q":"Paciente masculino de Edad 55 años con un Diagnóstico Primario: Infarto agudo de miocardio (IAM). En el día de hoy llega a nuestro departamento para efectuar sus ejercicios de rutina, pero a la media hora de comenzar los mismo comenzó a presentar mareos y dolor de cabeza. Al hacer la medición de los signos vitales se puede evidenciar una tensión arterial por encima de los valores normales: TA 160/90 mm/hg. Seleccione la respuesta correcta de acuerdo al signo vital alterado.","o":["Hipertermia","Hipotermia","Taquicardia","Hipertensión"],"a":3},{"s":"Técnica de Evaluación Funcional","q":"Paciente femenina de 68 años de edad con un Diagnóstico Primario: Enfermedad Pulmonar Obstructiva Crónica (EPOC) en estadio III (grave). Antecedentes:\n• Tabaquismo (paquete/año: 40, dejó de fumar hace 5 años).\n• Uso de broncodilatadores y corticosteroides inhalados para manejar los síntomas de EPOC. Actualmente se encuentra en un programa de rehabilitación pulmonar para mejorar su capacidad funcional y calidad de vida. Llega a nuestro departamento y luego de realizar los ejercicios de calentamiento y al comenzar con su programa de fisioterapia comienza a sentir la respiración demasiado acelerada y al hacer la valoración de los signos vitales dio Frecuencia Respiratoria (FR): 24 respiraciones por minuto en reposo. Seleccione la respuesta correcta de acuerdo con el signo vital alterado.","o":["Bradipnea","Taquipnea","Disnea","Apnea","Eupnea"],"a":1},{"s":"Técnica de Evaluación Funcional","q":"Paciente masculino de 37 años de edad con Diagnóstico Primario: Postoperatorio de reemplazo total de rodilla (RTM), pero al hacer el examen físico inicial para comenzar su sesión de fisioterapia del día el paciente presento una temperatura corporal: 38.5°C al inicio de la sesión, mostrando signos de fatiga y malestar general. El refiere sensación de calor, escalofríos y dolor en la rodilla operada. Seleccione la respuesta correcta de acuerdo con el signo vital alterado.","o":["Hipotermia","Febrícula","Hipertermia"],"a":1},{"s":"Técnica de Evaluación Funcional","q":"Paciente femenina de 58 años de edad con Diagnóstico Primario: Ataxia cerebelosa, la presenta refiere problemas de equilibrio y coordinación, especialmente al caminar. Al realizarle el Test de Romberg da como resultado que la misma pierde el equilibrio con los ojos cerrados y al abrir los ojos continua con las oscilaciones, indicando un problema en el cerebelo o en las vías centrales del sistema nervioso. De acuerdo a lo ante descrito ¿Qué tipo de resultado tiene el paciente? Seleccione la respuesta correcta.","o":["Positivo central.","Positivo periférico","Negativo"],"a":0},{"s":"Técnica de Evaluación Funcional","q":"Paciente masculino de 50 años de edad con Diagnóstico Primario: Neuropatía periférica, el paciente presenta dificultad para percibir la posición de sus extremidades en el espacio y pérdida de la sensibilidad en los pies. Ha sufrido varias caídas recientes debido a la falta de percepción de la posición de sus pies y piernas. De acuerdo con lo ante descrito ¿Qué tipo de alteración de la sensibilidad profunda presenta el paciente? Seleccione la respuesta correcta.","o":["Palestesia:","Barestesia:","Barognosia:","Estereognosia","Batiestesia"],"a":4},{"s":"Kinesiología","q":"Dentro de las consideraciones técnicas y principios generales para la aplicación de la cinesiterapia encontramos que tanto el paciente como el rehabilitador físico adoptarán posturas cómodas, adaptadas a cada función. El paciente no ha de realizar esfuerzos para mantener una posición determinada. Seleccione la respuesta correcta.","o":["Verdadero","Falso"],"a":0},{"s":"Kinesiología","q":"Comprende el conjunto de técnicas que se aplican sobre las estructuras afectadas, sin que el paciente realice ningún movimiento voluntario de la zona que hay que tratar. Seleccione la respuesta correcta.","o":["Cinesiterapia activa","Cinesiterapia pasiva","Cinesiterapia resistida"],"a":1},{"s":"Kinesiología","q":"Dentro de los objetivos y finalidades de la cinesiterapia pasiva encontramos. Seleccione la respuesta correcta.\n1. Prevenir la aparición de deformidades, adherencias, contracturas, evitar rigidez y anquilosis en posiciones viciosas.\n2. Mejorar la nutrición muscular y favorecer la circulación sanguínea y linfática.\n3. Preparar el músculo para un mejor trabajo activo, mediante estiramientos y acortamientos repetidos.\n4. Lograr una marcha funcional en corto plazo.\n5. Mantener la movilidad articular o restablecer la movilidad de las articulaciones que presentan limitaciones de movilidad.\n6. Estimular psíquicamente al paciente, incapaz de realizar movimientos por sí mismo.","o":["1,3,4,5,6","1,2,3,5,6","2,3,4,5,6"],"a":1},{"s":"Kinesiología","q":"La concientización del movimiento consiste en: Seleccione la respuesta correcta.","o":["Que el paciente realice los movimientos indicados por el rehabilitador físico.","Despertar los reflejos propioceptivos y la conciencia del movimiento, y contribuir a conservar o crear las imágenes periféricas del esquema corpo-ral y espacial.","Conservar o crear las imágenes periféricas del esquema corporal y espacial."],"a":1},{"s":"Kinesiología","q":"La clasificación de las movilizaciones pasivas son. Seleccione la respuesta correcta.\n1. Movilización pasiva asistida\n2. Movilización auto pasiva\n3. Movilización pasiva instrumental\n4. Movilización postural mantenida\n5. Movilización pasiva forzada\n6. Cinesiterapia pasiva mantenida\n7. Estiramientos musculotendinosos","o":["1,3,4,5,6,7","1,2,3,5,6,7","2,3,4,5,6,7"],"a":1},{"s":"Kinesiología","q":"La finalidad de esta movilización será curativa, ya que actuamos sobre una articulación que no está libre y es necesario vencer sus adherencias o limitaciones con el objetivo de recuperar su movilidad. Seleccione la respuesta correcta.","o":["Movilización pasiva asistida","Movilización auto pasiva","Movilización pasiva forzada"],"a":2},{"s":"Kinesiología","q":"Son técnicas cuyo objetivo es conseguir una elongación de las estructuras musculotendinosas, en mayor o menor medida, pueden ser manuales realizados por el fisioterapeuta o por el propio paciente. Seleccione la respuesta correcta.","o":["Movilización pasiva articular instrumental","Movilización pasiva forzada","Estiramientos musculotendinosos"],"a":2},{"s":"Kinesiología","q":"Este tipo de movilizaciones es realizado por el mismo paciente con sus propias fuerzas, de forma voluntaria o autorefleja, controlados, corregidos o ayudados por el fisioterapeuta. Seleccione la respuesta correcta.","o":["Cinesiterapia pasiva","Cinesiterapia activa","Movilización pasiva asistida"],"a":1},{"s":"Kinesiología","q":"La clasificación de las cinesiterapias activas son. Seleccione la respuesta correcta.\n1. Cinesiterapia activa asistida\n2. Cinesiterapia activa interna\n3. Cinesiterapia activa resistida\n4. Cinesiterapia activa libre","o":["1,2,4","1,3,4","1,2,3"],"a":1},{"s":"Kinesiología","q":"Dentro de los objetivos y finalidades de la cinesiterapia activa encontramos. Seleccione la respuesta correcta.\n1. Recuperar o mantener el tono y la función muscular.\n2. Evitar la atrofia muscular.\n3. Incrementar la resistencia y la potencia muscular, lo que llevará a su hipertrofia.\n4. Prevenir la aparición de deformidades y evitar rigidez y anquilosis en posiciones viciosas.\n5. Reforzar los movimientos articulares, conservando o recuperando al máximo su amplitud.\n6. Evitar las grandes rigideces articulares y aumentar la destreza y la velocidad del movimiento en las fases avanzadas del proceso rehabilitador.","o":["1,2,3,4,6","1,2,3,5,6","1,2,3,4,5"],"a":1},{"s":"Kinesiología","q":"La contracción muscular comienza cuando el sistema nervioso central recibe una información sensitiva y a partir de su integración se genera una respuesta motora. Podemos decir que la contracción muscular isométrica se produce cuando existe un aumento en la tensión muscular sin modificaciones e const LETTERS = "ABCDEFGH";
const KEY = "simLicFisio.v1";
const SUBJECTS = [...new Set(BANK.map(q => q.s))];
const subjCount = Object.fromEntries(SUBJECTS.map(s => [s, BANK.filter(q => q.s === s).length]));
const $ = id => document.getElementById(id);

let st = null;         // {ids:[...], answers:{idx:choice}, cur, n, subjects}
let cfg = { n: 100, subjects: new Set(SUBJECTS) };

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function load(){ try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r && Array.isArray(r.ids) && r.ids.every(i => BANK[i])) return r; }catch(e){} return null; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function newAttempt(){
  const pool = BANK.map((q,i)=>i).filter(i => cfg.subjects.has(BANK[i].s));
  const n = cfg.n === "all" ? pool.length : Math.min(cfg.n, pool.length);
  st = { ids: shuffle(pool).slice(0,n), answers:{}, cur:0, done:false, n:cfg.n, subjects:[...cfg.subjects] };
  save(); render();
}

function stats(){
  let ok=0,bad=0;
  for(const [k,v] of Object.entries(st.answers)){ const q=BANK[st.ids[k]]; if(v===q.a) ok++; else bad++; }
  return {ok,bad,answered:ok+bad,total:st.ids.length};
}

function render(){
  $("cfg").hidden = true;
  if(st.done){ renderResults(); return; }
  $("results").hidden = true; $("quiz").hidden = false;
  const i = st.cur, q = BANK[st.ids[i]], chosen = st.answers[i];
  const s = stats();
  $("count").textContent = `Pregunta ${i+1} de ${s.total}`;
  $("tOk").textContent = `${s.ok} ${s.ok===1?"acierto":"aciertos"}`; $("tBad").textContent = `${s.bad} ${s.bad===1?"error":"errores"}`;
  $("barFill").style.width = (100*s.answered/s.total)+"%";
  $("eyebrow").innerHTML = "";
  const e1=document.createElement("span"); e1.textContent=q.s; $("eyebrow").append(e1);
  const e2=document.createElement("span"); e2.textContent= q.o.length===2 && q.o.includes("Verdadero") ? "Verdadero / Falso" : `${q.o.length} opciones`; $("eyebrow").append(e2);
  $("qtext").textContent = q.q;
  const ul = $("opts"); ul.innerHTML = "";
  q.o.forEach((t,k) => {
    const li=document.createElement("li");
    const b=document.createElement("button"); b.type="button"; b.className="opt"; b.dataset.k=k;
    const bub=document.createElement("span"); bub.className="bub"; bub.textContent=LETTERS[k];
    const tx=document.createElement("span"); tx.className="txt"; tx.textContent=t;
    const mk=document.createElement("span"); mk.className="mark";
    b.append(bub,tx,mk);
    if(chosen!==undefined){
      b.disabled=true;
      if(k===q.a){ b.classList.add("correct"); mk.textContent = "Respuesta correcta"; }
      else if(k===chosen){ b.classList.add("wrong"); mk.textContent = "Tu respuesta"; }
    } else b.addEventListener("click", () => answer(k));
    li.append(b); ul.append(li);
  });
  const fb=$("fb"); fb.innerHTML="";
  if(chosen!==undefined){
    const d=document.createElement("div"); const right = chosen===q.a;
    d.className="feedback "+(right?"ok":"bad");
    const h=document.createElement("b"); h.textContent = right ? "¡Correcto!" : "Incorrecto";
    d.append(h);
    if(!right){ const a=document.createElement("span"); a.className="ans"; a.textContent=`La respuesta correcta es ${LETTERS[q.a]}) ${q.o[q.a]}`; d.append(a); }
    fb.append(d);
    if(q.n){ const n=document.createElement("div"); n.className="note"; n.textContent=q.n; fb.append(n); }
  }
  $("prev").disabled = i===0;
  const last = i===s.total-1;
  $("next").textContent = last ? "Ver resultados" : "Siguiente →";
  $("next").disabled = chosen===undefined && !last ? false : false;
  renderGrid();
}

function renderGrid(){
  const g=$("grid"); g.innerHTML="";
  st.ids.forEach((id,k) => {
    const c=document.createElement("button"); c.type="button"; c.className="cell"; c.textContent=k+1;
    const v=st.answers[k];
    if(v!==undefined) c.classList.add(v===BANK[id].a?"ok":"bad");
    if(k===st.cur) c.classList.add("cur");
    c.setAttribute("aria-label",`Ir a la pregunta ${k+1}`);
    c.addEventListener("click",()=>{ st.cur=k; save(); render(); window.scrollTo({top:0}); });
    g.append(c);
  });
}

function answer(k){
  if(st.answers[st.cur]!==undefined) return;
  st.answers[st.cur]=k; save(); render();
}
function go(d){
  const t=st.ids.length;
  if(d>0 && st.cur===t-1){ finish(); return; }
  st.cur=Math.max(0,Math.min(t-1,st.cur+d)); save(); render();
  $("card").scrollIntoView({block:"nearest"});
}
function finish(){
  const s=stats();
  if(s.answered<s.total){
    const firstOpen = st.ids.findIndex((_,k)=>st.answers[k]===undefined);
    const fb=$("fb"); fb.innerHTML="";
    const d=document.createElement("div"); d.className="note";
    d.textContent=`Te faltan ${s.total-s.answered} preguntas por responder. `;
    const go1=document.createElement("button"); go1.className="btn"; go1.type="button"; go1.textContent=`Ir a la pregunta ${firstOpen+1}`;
    go1.addEventListener("click",()=>{st.cur=firstOpen;save();render();});
    const end=document.createElement("button"); end.className="btn primary"; end.type="button"; end.textContent="Terminar de todos modos";
    end.addEventListener("click",()=>{st.done=true;save();render();window.scrollTo({top:0});});
    const row=document.createElement("div"); row.className="row"; row.style.marginTop="8px"; row.append(go1,end);
    d.append(row); fb.append(d); return;
  }
  st.done=true; save(); render(); window.scrollTo({top:0});
}

function renderResults(){
  $("quiz").hidden=true; const R=$("results"); R.hidden=false; R.innerHTML="";
  const s=stats(); const pct = s.total? Math.round(100*s.ok/s.total):0;
  const h=document.createElement("h2"); h.textContent="Resultado del simulacro"; R.append(h);
  const sc=document.createElement("div"); sc.className="score";
  sc.innerHTML=`<span class="big">${s.ok}</span><span class="of">/ ${s.total} correctas · ${pct}%</span>`;
  const v=document.createElement("span"); v.className="verdict";
  v.textContent = pct>=85 ? "Excelente dominio del banco." : pct>=70 ? "Buen nivel; repasa las asignaturas con menor puntaje." : "Conviene repasar antes del examen; revisa tus errores abajo.";
  v.style.color = pct>=70 ? "var(--ok)" : "var(--bad)";
  sc.append(v); R.append(sc);
  // by subject
  const by={}; st.ids.forEach((id,k)=>{ const q=BANK[id]; by[q.s]=by[q.s]||{t:0,ok:0}; by[q.s].t++; if(st.answers[k]===q.a) by[q.s].ok++; });
  const rows=Object.entries(by).sort((a,b)=>a[1].ok/a[1].t-b[1].ok/b[1].t);
  const tw=document.createElement("div"); tw.className="tbl-wrap";
  let html=`<table><thead><tr><th>Asignatura</th><th class="n">Aciertos</th><th class="n">%</th><th style="width:28%"></th></tr></thead><tbody>`;
  for(const [name,o] of rows){ const p=Math.round(100*o.ok/o.t); html+=`<tr><td>${esc(name)}</td><td class="n">${o.ok}/${o.t}</td><td class="n">${p}%</td><td><div class="meter"><i style="width:${p}%"></i></div></td></tr>`; }
  tw.innerHTML=html+"</tbody></table>"; R.append(tw);
  const acts=document.createElement("div"); acts.className="row";
  const again=document.createElement("button"); again.className="btn primary"; again.type="button"; again.textContent="Nuevo simulacro (otras preguntas al azar)";
  again.addEventListener("click", newAttempt);
  const rev=document.createElement("button"); rev.className="btn"; rev.type="button"; rev.textContent="Revisar este simulacro";
  rev.addEventListener("click",()=>{ st.done=false; st.cur=0; save(); render(); });
  acts.append(again,rev); R.append(acts);
  const wrong=st.ids.map((id,k)=>({q:BANK[id],k,c:st.answers[k]})).filter(x=>x.c!==x.q.a);
  if(wrong.length){
    const h3=document.createElement("h2"); h3.textContent=`Preguntas para repasar (${wrong.length})`; h3.style.fontSize="1.1rem"; R.append(h3);
    const ul=document.createElement("ul"); ul.className="miss";
    for(const x of wrong){
      const li=document.createElement("li");
      const e=document.createElement("div"); e.className="eyebrow"; e.textContent=`${x.k+1} · ${x.q.s}`;
      const q=document.createElement("div"); q.className="q"; q.textContent=x.q.q;
      li.append(e,q);
      const y=document.createElement("div"); y.className="you"; y.textContent= x.c===undefined ? "Sin responder" : `Tu respuesta: ${LETTERS[x.c]}) ${x.q.o[x.c]}`;
      const r=document.createElement("div"); r.className="right"; r.textContent=`Correcta: ${LETTERS[x.q.a]}) ${x.q.o[x.q.a]}`;
      li.append(y,r); ul.append(li);
    }
    R.append(ul);
  }
}
function esc(t){ return t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// settings panel
function openCfg(){
  cfg.subjects = new Set(st && st.subjects ? st.subjects : SUBJECTS);
  cfg.n = st ? st.n : 100;
  const nr=$("nRow"); nr.innerHTML="";
  [25,50,100,"all"].forEach(n=>{ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent= n==="all"?"Todas":n; b.setAttribute("aria-pressed", String(cfg.n===n)); b.addEventListener("click",()=>{cfg.n=n; [...nr.children].forEach(c=>c.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); updAvail();}); nr.append(b); });
  const sr=$("subjRow"); sr.innerHTML="";
  SUBJECTS.forEach(s=>{ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.innerHTML=`${esc(s)}<small>${subjCount[s]}</small>`; b.setAttribute("aria-pressed", String(cfg.subjects.has(s))); b.addEventListener("click",()=>{ cfg.subjects.has(s)?cfg.subjects.delete(s):cfg.subjects.add(s); b.setAttribute("aria-pressed", String(cfg.subjects.has(s))); updAvail(); }); sr.append(b); });
  updAvail(); $("cfg").hidden=false; $("cfg").scrollIntoView({block:"start"});
}
function updAvail(){
  const pool=SUBJECTS.filter(s=>cfg.subjects.has(s)).reduce((a,s)=>a+subjCount[s],0);
  const n = cfg.n==="all"?pool:Math.min(cfg.n,pool);
  $("avail").textContent = pool ? `${n} preguntas al azar de ${pool} disponibles` : "Elige al menos una asignatura";
  $("cfgGo").disabled = pool===0;
}
$("allOn").addEventListener("click",()=>{cfg.subjects=new Set(SUBJECTS);[...$("subjRow").children].forEach(c=>c.setAttribute("aria-pressed","true"));updAvail();});
$("allOff").addEventListener("click",()=>{cfg.subjects=new Set();[...$("subjRow").children].forEach(c=>c.setAttribute("aria-pressed","false"));updAvail();});
$("btnCfg").addEventListener("click",openCfg);
$("cfgCancel").addEventListener("click",()=>{$("cfg").hidden=true;});
$("cfgGo").addEventListener("click",newAttempt);
$("btnNew").addEventListener("click",()=>{ cfg.n = st? st.n:100; cfg.subjects=new Set(st&&st.subjects?st.subjects:SUBJECTS); newAttempt(); window.scrollTo({top:0}); });
$("prev").addEventListener("click",()=>go(-1));
$("next").addEventListener("click",()=>go(1));
document.addEventListener("keydown",e=>{
  if(!st||st.done||!$("cfg").hidden||e.metaKey||e.ctrlKey||e.altKey) return;
  const q=BANK[st.ids[st.cur]];
  const k=LETTERS.indexOf(e.key.toUpperCase());
  if(k>=0 && k<q.o.length && st.answers[st.cur]===undefined){ answer(k); e.preventDefault(); }
  else if(e.key==="Enter" && st.answers[st.cur]!==undefined && document.activeElement.tagName!=="BUTTON"){ go(1); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ go(1); } else if(e.key==="ArrowLeft"){ go(-1); }
});

$("sub").textContent = `Fisioterapia · ${BANK.length} preguntas de ${SUBJECTS.length} asignaturas · 100 al azar por simulacro`;
st = load();
if(!st) { newAttempt(); } else render();
</script>
</body>
</html>
